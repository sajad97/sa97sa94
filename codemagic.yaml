# ============================================================
# Codemagic — Alee Customer App (iOS App Store build)
#
# Signing: MANUAL via Code signing identities.
# In Codemagic UI go to: Team settings > codemagic.yaml settings
# > Code signing identities and upload:
#   - iOS certificate: Apple Distribution (.p12 + password)
#       Reference name must be: Alee_AppStore
#   - iOS provisioning profile: App Store profile for
#       com.alee.shein (.mobileprovision)
#       Reference name must be: alee_app_store
# The ios_signing block below only FETCHES those uploaded files
# onto the build machine. It does NOT create them.
# xcode-project use-profiles then applies them to Runner.xcodeproj
# and generates the ExportOptions.plist used for the IPA export.
#
# No keys, certificates or profiles are stored in this repository.
# IPA is stored in build artifacts only — no upload, no review.
# Manual builds only (no automatic triggers).
# ============================================================

workflows:
  ios-app-store-ipa:
    name: Alee iOS App Store IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: "3.44.2"   # must match pubspec.lock resolution (>=3.41.0)
      xcode: latest
      cocoapods: default
      ios_signing:
        # Fetch the identities uploaded in Codemagic UI by their
        # reference names (see header). These are NOT auto-created.
        provisioning_profiles:
          - alee_app_store
        certificates:
          - Alee_AppStore
      vars:
        BUNDLE_ID: com.alee.shein
        APPLE_TEAM_ID: NUQ5XHT8NT
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Locate Flutter project and install dependencies
        script: |
          set -euo pipefail
          if [ -f pubspec.yaml ]; then
            PROJ="."
          else
            PROJ="$(dirname "$(find . -maxdepth 3 -name pubspec.yaml -not -path '*/build/*' | head -n1)")"
          fi
          echo "Flutter project dir: $PROJ"
          echo "PROJECT_DIR=$PROJ" > .cm_project_dir
          cd "$PROJ"
          flutter pub get
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          PROJ="$(grep '^PROJECT_DIR=' .cm_project_dir | cut -d= -f2-)"
          cd "$PROJ/ios"
          pod install
      - name: Apply provisioning profiles to Xcode project
        script: |
          set -euo pipefail
          PROJ="$(grep '^PROJECT_DIR=' .cm_project_dir | cut -d= -f2-)"
          cd "$PROJ"
          # Applies the fetched App Store profile/cert to ios/Runner.xcodeproj
          # (explicit --project so Pods.xcodeproj is NOT touched) and writes
          # the matching export options to $HOME/export_options.plist
          xcode-project use-profiles \
            --project "ios/Runner.xcodeproj" \
            --archive-method app-store \
            --export-options-plist "$HOME/export_options.plist"
      - name: Build signed IPA (App Store distribution)
        script: |
          set -euo pipefail
          PROJ="$(grep '^PROJECT_DIR=' .cm_project_dir | cut -d= -f2-)"
          cd "$PROJ"
          # Build 11 was the last produced. Offset by 12 so every CI
          # build number is > 11 and unique across runs.
          BUILD_NUM=$(( ${PROJECT_BUILD_NUMBER:-0} + 12 ))
          echo "BUILD_NUM=$BUILD_NUM" >> .cm_project_dir
          echo "Version 4.3.1 — build number: $BUILD_NUM"
          # Export options generated by use-profiles (matches the chosen
          # certificate + App Store profile), NOT the repo's ExportOptions.plist
          flutter build ipa --release \
            --build-name=4.3.1 \
            --build-number="$BUILD_NUM" \
            --export-options-plist "$HOME/export_options.plist"
      - name: Verify signing, bundle ID, team and version
        script: |
          set -euo pipefail
          PROJ="$(grep '^PROJECT_DIR=' .cm_project_dir | cut -d= -f2-)"
          BUILD_NUM="$(grep BUILD_NUM .cm_project_dir | cut -d= -f2)"
          cd "$PROJ"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA: $IPA"
          TMP=$(mktemp -d)
          unzip -q "$IPA" -d "$TMP"
          APP="$TMP/Payload/Runner.app"

          echo "--- codesign --verify --deep --strict ---"
          codesign --verify --deep --strict "$APP"
          echo "codesign verify: PASS"

          SIGN=$(codesign -dv --verbose=4 "$APP" 2>&1)
          echo "$SIGN" | grep -E "Authority|TeamIdentifier|Identifier=" || true

          echo "$SIGN" | grep -q "TeamIdentifier=$APPLE_TEAM_ID" || {
            echo "FAIL: TeamIdentifier is not $APPLE_TEAM_ID"; exit 1; }
          echo "$SIGN" | grep -q "Authority=Apple Distribution" || {
            echo "FAIL: not signed with an Apple Distribution certificate"; exit 1; }
          echo "signature checks: PASS"

          ACTUAL_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          ACTUAL_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "CFBundleIdentifier=$ACTUAL_ID CFBundleShortVersionString=$ACTUAL_VER CFBundleVersion=$ACTUAL_BUILD"
          [ "$ACTUAL_ID" = "$BUNDLE_ID" ] || { echo "FAIL: bundle id mismatch"; exit 1; }
          [ "$ACTUAL_VER" = "4.3.1" ] || { echo "FAIL: version mismatch"; exit 1; }
          [ "$ACTUAL_BUILD" = "$BUILD_NUM" ] || { echo "FAIL: build number mismatch"; exit 1; }
          echo "identifier/version checks: PASS"
    artifacts:
      - "**/*.ipa"
    # publishing: intentionally omitted — no upload, no review submission.

  # --------------------------------------------------------------
  # READ-ONLY signing diagnostics — run manually when signing fails.
  # Prints SHA-1 fingerprints of keychain identities, uploaded certs,
  # and certs embedded in each provisioning profile, then matches
  # them. No private keys, no passwords, nothing created/revoked.
  # --------------------------------------------------------------
  ios-signing-diagnostics:
    name: iOS signing diagnostics (read-only)
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      ios_signing:
        provisioning_profiles:
          - alee_app_store
        certificates:
          - Alee_AppStore
      vars:
        BUNDLE_ID: com.alee.shein
        APPLE_TEAM_ID: NUQ5XHT8NT
    scripts:
      - name: Inspect signing identities vs provisioning profiles
        script: |
          # Read-only diagnostics — fingerprints only.
          set -uo pipefail

          echo "===== 1) Signing identities (cert WITH private key) ====="
          security find-identity -v -p codesigning || echo "(none found)"

          echo ""
          echo "===== 2) All certificates in keychain (may lack private key) ====="
          security find-certificate -a -Z 2>/dev/null | grep -E 'SHA-1 hash|labl' || echo "(none)"

          CERTS_DIR="$HOME/Library/MobileDevice/Certificates"
          echo ""
          echo "===== 3) Uploaded certificate files: $CERTS_DIR ====="
          for cf in "$CERTS_DIR"/*; do
            [ -e "$cf" ] || continue
            echo "--- $(basename "$cf")"
            case "$cf" in
              *.p12|*.P12)
                echo "  (.p12 container — skipped, password-protected)" ;;
              *)
                openssl x509 -inform der -in "$cf" -noout -subject -fingerprint -sha1 2>/dev/null \
                  || openssl x509 -in "$cf" -noout -subject -fingerprint -sha1 2>/dev/null \
                  || echo "  (not a readable .cer/.pem)" ;;
            esac
          done

          echo ""
          echo "===== 4) Provisioning profiles ====="
          CERTFPS_FILE="$(mktemp)"
          : > "$CERTFPS_FILE"
          FOUND_PROF=0
          for prof in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision \
                      "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision; do
            [ -e "$prof" ] || continue
            FOUND_PROF=1
            echo "--- $(basename "$prof") ---"
            TMPD=$(mktemp -d)
            if security cms -D -i "$prof" -o "$TMPD/profile.plist" 2>/dev/null; then
              for k in Name UUID ExpirationDate; do
                v=$(/usr/libexec/PlistBuddy -c "Print :$k" "$TMPD/profile.plist" 2>/dev/null) && echo "  $k: $v"
              done
              v=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$TMPD/profile.plist" 2>/dev/null) && echo "  TeamIdentifier: $v"
              v=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$TMPD/profile.plist" 2>/dev/null) && echo "  aps-environment: $v"
              i=0
              while plutil -extract "DeveloperCertificates.$i" raw -o "$TMPD/cert$i.der" "$TMPD/profile.plist" 2>/dev/null; do
                fp=$(openssl x509 -inform der -in "$TMPD/cert$i.der" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':' | tr 'a-f' 'A-F')
                echo "    cert[$i] SHA-1: $fp"
                echo "$fp" >> "$CERTFPS_FILE"
                i=$((i+1))
              done
              echo "  DeveloperCertificates: $i"
            else
              echo "  (cannot decode profile)"
            fi
          done
          [ "$FOUND_PROF" -eq 1 ] || echo "(no .mobileprovision files installed)"

          echo ""
          echo "===== 5) Identity vs profile match ====="
          IDFPS=$(security find-identity -v -p codesigning 2>/dev/null | grep -oE '[0-9A-F]{40}' | sort -u)
          if [ -z "$IDFPS" ]; then
            echo "RESULT: no signing identities with private keys in keychain"
          else
            ANY=0
            for fp in $IDFPS; do
              if grep -q "$fp" "$CERTFPS_FILE"; then
                echo "MATCH    : identity $fp IS covered by a provisioning profile"
                ANY=1
              else
                echo "NO MATCH : identity $fp is NOT covered by any provisioning profile"
              fi
            done
            [ "$ANY" -eq 1 ] || echo "RESULT: no keychain identity is inside any profile -> profile was issued for a different certificate"
          fi
